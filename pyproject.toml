[project]
name = "fallacy-map"
version = "1.0.0"
description = "The Fallacy Map — Inverion Sunrise Engine for argument analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.3",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "geopy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
inverion-bridge = "server:main"
gdelt-scraper = "engine.gdeltscraper:main"
geo-transform = "engine.geo_transformer:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]